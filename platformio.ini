; Minimal LED strip controller for a classic ESP32 (not S3).
; Board: generic ESP32 dev module (e.g. "ESP-32" silkscreen, CP2102 USB-UART).
; No changes needed here for WS2811 12V modules — FastLED already supports
; the WS2811 chipset, same two libraries as before.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
lib_deps =
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.0.4
